name: recipespellbook
description: "An advanced recipe app for all uses."
publish_to: 'none'

version: 1.3.0+10

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.4
  
  # State Management
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^9.0.0

  # Navigation
  go_router: ^14.8.1

  # UI
  photo_view: 0.14.0

  # Firebase / Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.2.2

  # Import features
  http: ^1.2.0
  html: ^0.15.4
  file_picker: ^8.0.7
  share_plus: ^12.0.1
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.0.7
  pdfx: ^2.6.0
  pdf: ^3.10.8
  printing: ^5.12.0
  google_fonts: ^8.0.1
  archive: ^3.4.9
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.1
  app_links: ^3.4.0
  share_handler: ^0.0.21
  mobile_scanner: ^7.0.0
  purchases_flutter: ^8.11.0
  purchases_ui_flutter: ^8.11.0
  timeago: ^3.7.1
  cached_network_image: ^3.4.1
  device_info_plus: ^9.1.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.19.0
  build_runner: ^2.4.13
  flutter_native_splash: ^2.3.8
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"

flutter_native_splash:
  color: "#000000"
  android: true
  ios: true
  android_12:
    color: "#000000"
    icon_background_color: "#000000"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/common_ingredients.json
    - assets/images/
    - assets/images/default_recipes/
    - assets/images/themes/
    - assets/images/guides/
    - assets/images/faqs/
    - assets/rpg/avatars/
    - assets/rpg/frames/
    - assets/rpg/pets/
    - assets/images/icon.png
    - assets/images/splash_logo.png
    - assets/images/cookbook_placeholder_normal.png
    - assets/images/cookbook_placeholder_rpg.png
    - assets/images/recipe_placeholder_normal.png
    - assets/images/recipe_placeholder_rpg.png
    - assets/images/3rd-party/instacart_carrot.png
    - assets/images/3rd-party/instacart_carrot_white.png
    - assets/animations/

msix_config:
  display_name: Recipe Spellbook
  publisher_display_name: ANordlund
  identity_name: com.recipespellbook.app
  logo_path: assets/images/icon.png
  capabilities:
    - internetClient