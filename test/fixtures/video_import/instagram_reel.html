<title>Brunch Club on Instagram: &quot;Lemon ricotta pancakes 🍋🥞 fluffy every single time

Ingredients:
1 cup flour
1 tbsp sugar
2 tsp baking powder
3/4 cup ricotta
2/3 cup milk
2 eggs
1 lemon, zested

Whisk the dry ingredients, then fold in the ricotta, milk, eggs and lemon zest.
Cook 1/4 cup portions on a buttered pan until bubbles form, then flip.
